[package]
name = "tapo-rest"
version = "0.4.7"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", default-features = false, features = [
  "http1",
  "http2",
  "tokio",
  "json",
  "query",
  "macros", # For debugging with #[axum::debug_handler]
] }
clap = { version = "4.6.5", features = ["derive", "env"] }
rand = "0.10.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tapo = "0.9.0"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "fs", "signal"] }
tower-http = { version = "0.7.0", features = ["cors"] }
dirs = "6.0.0"
paste = "1.0.15"
axum-extra = { version = "0.12.6", features = ["typed-header"] }
chrono = { version = "0.4.45", default-features = false, features = [
  "std",
  "serde",
] }
log = { version = "0.4.33", features = ["std"] }
colored = "3.1.1"
